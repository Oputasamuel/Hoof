services:
  - type: web
    name: hoof-dcl-api
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hoof-dcl-postgres
          property: connectionString
      - key: PGSSL
        value: disable
      - key: DCL_CATALYST
        value: https://peer.decentraland.org
      - key: MIN_RACE_WALL_SECONDS
        value: "10"
      - key: MAX_RACE_WALL_SECONDS
        value: "420"

databases:
  - name: hoof-dcl-postgres
    databaseName: hoof
    user: hoof
    region: frankfurt
    plan: free
